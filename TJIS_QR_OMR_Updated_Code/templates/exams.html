{% extends "base.html" %}{% block content %}<h1>Exams</h1><section class="panel"><form method="post"><input name="title" placeholder="Exam title" required><input name="grade" placeholder="Grade" required><input name="subject" placeholder="Subject" required><input name="exam_date" type="date"><input name="duration" type="number" placeholder="Duration minutes"><input name="instructions" placeholder="Instructions"><button>Create Exam</button></form></section>{% for e in exams %}<p class="panel">{{e.title}} · Grade {{e.grade}} · {{e.subject}} <a href="/exam/{{e.id}}">Manage</a></p>{% endfor %}{% endblock %}

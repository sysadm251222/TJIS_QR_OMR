{% extends "base.html" %}{% block content %}<h1>Results</h1><table><tr><th>Student</th><th>Admission</th><th>Grade</th><th>Exam</th><th>Marks</th><th>Status</th><th></th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.admission_no}}</td><td>{{r.grade}}</td><td>{{r.title}} / {{r.subject}}</td><td>{{r.marks}} / {{r.maximum}}</td><td>{{r.status}}</td><td><a href="/grade/{{r.sid}}">Review</a></td></tr>{% endfor %}</table>{% endblock %}

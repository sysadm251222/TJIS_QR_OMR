{% extends "base.html" %}{% block content %}<h1>Edit Student Profile</h1><section class="panel narrow"><form method="post"><label>Admission Number<input name="admission_no" value="{{s.admission_no}}" required></label><label>Student Name<input name="name" value="{{s.name}}" required></label><label>Grade / Class<input name="grade" value="{{s.grade}}" required></label><label>Section<input name="section" value="{{s.section or ''}}"></label><label>Roll Number<input name="roll_no" value="{{s.roll_no or ''}}"></label><button>Save Changes</button> <a class="button secondary" href="{{url_for('students')}}">Cancel</a></form></section>{% endblock %}

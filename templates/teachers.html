{% extends "base.html" %}{% block content %}<h1>Teacher Login Management</h1><section class="panel"><h2>Create teacher login</h2><form method="post"><input name="full_name" placeholder="Teacher full name" required><input name="username" placeholder="Username" required><input name="password" type="password" minlength="8" placeholder="Temporary password (8+ characters)" required><button>Create Teacher Login</button></form></section><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Action</th></tr>{% for u in users %}<tr><td>{{u.full_name}}</td><td>{{u.username}}</td><td>{{u.role}}</td><td>{{'Active' if u.active else 'Disabled'}}</td><td>{% if u.role=='teacher' %}<form method="post" action="/teachers/{{u.id}}/toggle"><button class="secondary">{{'Disable' if u.active else 'Enable'}}</button></form>{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
